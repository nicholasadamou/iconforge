schema-version = "1.18.0"

[install]
bun.pkg-path = "bun"
nodejs.pkg-path = "nodejs_24"
git.pkg-path = "git"
pre-commit.pkg-path = "pre-commit"

[vars]
NEXT_TELEMETRY_DISABLED = "1"

[profile]
common = '''
  echo "IconForge: bun install --frozen-lockfile; bun run dev"
'''

[services.dev]
command = "bun run dev"

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
