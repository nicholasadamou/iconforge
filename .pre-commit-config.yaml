repos:
  - repo: local
    hooks:
      - id: checks
        name: CI static checks
        entry: flox activate -- bun run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: unit-tests
        name: CI unit tests
        entry: flox activate -- bun run test:ci
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: production
        name: CI production build and browser tests
        entry: flox activate -- bun run verify:production
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
